# Render.com Blueprint: Render panelinde "New > Blueprint" ile bu depoyu seçin.
# Kalıcı disk (siparişlerin silinmemesi için) ücretli planlarda bulunur; "starter" seçili.
services:
  - type: web
    name: ilna-kafe-qr
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Istanbul
      - key: DATA_DIR
        value: /var/data
      - key: BRANCH
        value: sube1
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: ilna-data
      mountPath: /var/data
      sizeGB: 1
